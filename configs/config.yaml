# =============================================================================
# BIDA ML Starter - Konfiguration
# =============================================================================
# Beim Projektstart nur das Nötigste ausfüllen (project.name, tables).
#
# Umgebung: "{env}" wird beim Laden durch ML_ENV aus .env ersetzt (DEV, INT oder
# PROD). Damit zeigt dieselbe Config je nach Umgebung auf DEV_ML / DEV_DATALAKE
# oder PROD_ML / PROD_DATALAKE. Nie DEV_ oder PROD_ fest eintragen.
# =============================================================================

project:
  name: "Mein ML Projekt"
  version: "0.1.0"
  random_state: 42

snowflake:
  role: "ML_DEVELOPER"
  warehouse: "CONSUMER"
  database: "{env}_ML"           # Ziel für alle Outputs des Notebooks
  schemas:
    inference: "INFERENCE"       # Forecasts / Predictions (z.B. FORECAST_SNAPSHOT)
    registry: "REGISTRY"         # Modell-Läufe, Parameter, Deployment
    monitoring: "MONITORING"     # Metriken, DQ-Checks, Forecast vs. Actual

# Quelltabellen oder Views, voll qualifiziert mit {env}. Rohdaten liegen im
# DATALAKE; die *_90 Views liefern ein rollierendes 90-Tage-Fenster.
# Beispiel Rüstmengen-Forecast:
#   training_data: "{env}_DATALAKE.MSACCESS.PSA_CSV_LOGISTIK_RUESTMENGEN_90"
#   actuals:       "{env}_DATALAKE.WAMAS4.PSA_W4_LOGISTIK_RUESTMENGEN_90"
tables:
  training_data: ""
