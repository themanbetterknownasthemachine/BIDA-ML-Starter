# =============================================================================
# BIDA ML Starter - Konfiguration
# =============================================================================
# Beim Projektstart nur das Noetigste ausfuellen (project.name, tables).
# Alles andere ergaenzen, wenn es gebraucht wird.
# =============================================================================

project:
  name: "Mein ML Projekt"
  version: "0.1.0"
  random_state: 42

snowflake:
  role: "ML_DEVELOPER"
  warehouse: "CONSUMER"
  # Ziel-Datenbank fuer alle Outputs. Wird von SF_DATABASE in .env ueberschrieben:
  # DEV_ML waehrend der Entwicklung, PROD_ML nach dem Deployment. Schemas sind in beiden gleich.
  database: "DEV_ML"
  schemas:
    inference: "INFERENCE"       # Forecasts / Predictions (z.B. FORECAST_SNAPSHOT)
    registry: "REGISTRY"         # Modell-Laeufe, Parameter, Deployment
    monitoring: "MONITORING"     # Metriken, DQ-Checks, Forecast vs. Actual

# Quelltabellen oder Views, voll qualifiziert (DATENBANK.SCHEMA.OBJEKT).
# Rohdaten liegen in PROD_DATALAKE; die *_90 Views liefern ein rollierendes
# 90-Tage-Fenster. Beispiel Ruestmengen-Forecast:
#   training_data: "PROD_DATALAKE.MSACCESS.PSA_CSV_LOGISTIK_RUESTMENGEN_90"
tables:
  # Hier den voll qualifizierten Namen der Quell-View eintragen, z.B.:
  # training_data: "PROD_DATALAKE.MSACCESS.PSA_CSV_LOGISTIK_RUESTMENGEN_90"
  training_data: ""
