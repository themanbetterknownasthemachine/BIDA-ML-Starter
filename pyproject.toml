[project]
name = "bida-ml-starter"
version = "0.2.0"
description = "Pistor BIDA ML Starter Template: Forecasting, Klassifikation, Regression"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Snowflake
    "snowflake-snowpark-python>=1.40",
    "snowflake-connector-python[pandas]>=3.15",
    "cryptography>=43",            # Key-Pair Auth
    "python-dotenv>=1.0",

    # Data
    "pandas>=2.2,<3",
    "numpy>=2.0",
    "pyarrow>=17",
    "openpyxl>=3.1",

    # ML
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "optuna>=4.0",
    "imbalanced-learn>=0.13",
    "shap>=0.47",

    # Time Series
    "statsmodels>=0.14",
    "statsforecast>=2.0",
    "mlforecast>=1.0",
    "neuralforecast>=3.0",
    "holidays>=0.60",

    # Plots & Utilities
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.14",
    "joblib>=1.4",
    "tqdm>=4.66",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

# PyTorch-Variante waehlen:
#   uv sync --extra cpu   -> Laptop ohne GPU, VM (kleiner Download)
#   uv sync --extra gpu   -> Lenovo Notebook mit NVIDIA GPU (CUDA 13.0, Treiber >= 580)
#   uv sync               -> PyPI-Standard (Windows: CPU, Linux: CUDA)
[project.optional-dependencies]
cpu = ["torch>=2.5"]
gpu = ["torch>=2.5"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "ruff>=0.8",
    "pytest>=8.0",
    "nbstripout>=0.8",
    "pre-commit>=4.0",
]

[tool.uv]
# Firmen-Proxy mit eigenem Zertifikat: Zertifikate aus dem Windows-Store verwenden
system-certs = true
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# numba braucht ein aktuelles llvmlite; ohne Constraint waehlt der Resolver ein altes numba ohne Python-3.12-Wheel
constraint-dependencies = ["numba>=0.61"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Aeltere NVIDIA-Treiber (< 580): URL auf .../whl/cu126 aendern und "uv lock" ausfuehren
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]
force-exclude = true   # Ausschluss gilt auch, wenn pre-commit Dateien explizit uebergibt

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
